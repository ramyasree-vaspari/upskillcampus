{% extends 'base.html' %}

{% block content %}
<div class="glass-card glass-card-large">
    <h2 class="title">Cast Your Vote</h2>
    <p class="subtitle">Welcome {{ session.name }}, please select a candidate.</p>

    <div class="candidates-grid">
        {% for candidate in candidates %}
        <div class="candidate-card" onclick="selectCandidate(this, {{ candidate.id }}, '{{ candidate.name }}')">
            <div class="candidate-avatar">
                {{ candidate.name[0] }}
            </div>
            <div class="candidate-name">{{ candidate.name }}</div>
            <div class="candidate-party">{{ candidate.party }}</div>
        </div>
        {% endfor %}
    </div>

    <div style="margin-top: 2rem; text-align: center;">
        <button id="submit-vote" class="btn" style="width: auto; padding: 1rem 3rem; opacity: 0.5; pointer-events: none;" onclick="castVote()">
            Confirm Vote
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let selectedId = null;
    let selectedName = null;

    function selectCandidate(element, id, name) {
        document.querySelectorAll('.candidate-card').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        
        selectedId = id;
        selectedName = name;
        
        const btn = document.getElementById('submit-vote');
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
    }

    function castVote() {
        if(!selectedId) return;

        Swal.fire({
            title: 'Confirm Vote',
            text: `Are you sure you want to vote for ${selectedName}? This action cannot be undone.`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#4F46E5',
            cancelButtonColor: '#ef4444',
            confirmButtonText: 'Yes, cast vote!'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({
                    title: 'Casting vote...',
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });

                fetch('/vote', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ candidate_id: selectedId })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        Swal.fire('Voted!', 'Your vote has been securely recorded.', 'success')
                        .then(() => window.location.href = '/');
                    } else {
                        Swal.fire('Error', data.message, 'error');
                    }
                })
                .catch(err => {
                    Swal.fire('Error', 'Failed to submit vote.', 'error');
                });
            }
        });
    }
</script>
{% endblock %}
